services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: api
    env_file:
      - ../.env
    ports:
      - '4000:4000'

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: web
    env_file:
      - ../.env
    ports:
      - '3000:3000'
    depends_on:
      - api

  admin:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: admin
    env_file:
      - ../.env
    ports:
      - '3001:3001'
    depends_on:
      - api

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: bot
    env_file:
      - ../.env
    depends_on:
      - api
